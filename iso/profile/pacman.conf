#
# Build-time /etc/pacman.conf template for the Artix dinit live ISO.
# build.sh replaces @REPO_DIR@ with the absolute path of the local repository.
#
# Direct Server lines (rather than Include) are intentional: mkarchiso parses
# this file on the build host, which does not have our Artix mirrorlists in
# /etc/pacman.d. The image's own pacman.conf uses Includes and ships the same
# mirrorlists under /etc/pacman.d/. Only Artix repos are enabled.
#
[options]
Architecture = auto
# Build-time only: the host may not trust the Artix signing keys, so pacstrap
# would reject every package ("unknown trust"). The live image stays strict.
SigLevel = Optional TrustAll
LocalFileSigLevel = Optional
ParallelDownloads = 8
DisableDownloadTimeout

NoExtract = usr/share/locale/*
NoExtract = usr/share/man/*
NoExtract = usr/share/doc/*
NoExtract = usr/share/help/*
NoExtract = usr/share/gtk-doc/*

[system]
Server = https://mirror.clarkson.edu/artix-linux/repos/system/os/$arch
Server = https://mirror1.artixlinux.org/repos/system/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/system/os/$arch

[world]
Server = https://mirror.clarkson.edu/artix-linux/repos/world/os/$arch
Server = https://mirror1.artixlinux.org/repos/world/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/world/os/$arch

[galaxy]
Server = https://mirror.clarkson.edu/artix-linux/repos/galaxy/os/$arch
Server = https://mirror1.artixlinux.org/repos/galaxy/os/$arch
Server = https://mirrors.dotsrc.org/artix-linux/repos/galaxy/os/$arch

# Packages built by build.sh (cosmalia-session-dinit, cosmic-comp-traffic).
[cosmalia]
SigLevel = Optional TrustAll
Server = file://@REPO_DIR@

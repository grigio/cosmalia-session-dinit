# Live-media initramfs: Artix's own live hooks (vendored from artools),
# converted to POSIX test syntax so they work with mkinitcpio's busybox ash.
# The `microcode` hook loads both intel-ucode and amd-ucode (Intel + AMD).
# Shipped as a mkinitcpio.conf.d drop-in so the kernel package's generated
# /etc/mkinitcpio.d/linux.preset keeps working unchanged.
#
# No kms hook: on live media there is no autodetect, so kms would load every
# DRM driver. udev loads the right one at boot. loop + dm-snapshot are needed
# before the archiso hook mounts airootfs.sfs.
MODULES=(loop dm-snapshot)

# cosmalia_bootlog is last: it wraps the Artix mount handler, writes
# BOOTLOG.TXT to the USB's ARCHISO_EFI partition, and forces safe overlayfs
# options on kernel 7.x.
HOOKS=(base udev microcode artix artix_loop_mnt modconf block filesystems keyboard keymap cosmalia_bootlog)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)

# Live-media initramfs: archiso hooks (mounts airootfs.sfs) + microcode.
# Shipped as a mkinitcpio.conf.d drop-in so the kernel package's generated
# /etc/mkinitcpio.d/linux.preset keeps working unchanged.
#
# No `kms` hook: on live media there is no `autodetect`, so `kms` would load
# every DRM driver (and break some machines). udev loads the right one at boot.
# loop + dm-snapshot must be loaded before the archiso hook runs, otherwise
# losetup cannot allocate /dev/loopN for airootfs.sfs (Artix's own live
# initcpio config sets the same MODULES).
MODULES=(loop dm-snapshot)

HOOKS=(base udev microcode keymap modconf archiso archiso_loop_mnt block filesystems keyboard)

COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3)

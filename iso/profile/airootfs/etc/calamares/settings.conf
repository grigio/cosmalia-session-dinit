# Cosmalia live ISO — Artix/dinit Calamares configuration.
#
# This is an OFFLINE install: the target root is the very same squashfs the
# live session is running from (see modules/unpackfs.conf). No network,
# pacstrap or package chooser is needed, so the installed system is exactly
# the Cosmalia environment you just booted.
#
# Artix ships Calamares 3.4.2 with an upstream bootloader module that does
# not know about Limine and a services-openrc module that does not apply to
# dinit. Both are replaced by shellprocess instances below:
#   shellprocess@cosmalia  -> dinit services, greetd, initramfs
#   shellprocess@limine    -> ESP bootloader + Limine menu entries
---
modules-search: [ local ]

instances:
- id:       cosmalia
  module:   shellprocess
  config:   shellprocess_cosmalia.conf

- id:       limine
  module:   shellprocess
  config:   shellprocess_limine.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # No machineid module: it calls systemd-machine-id-setup, absent on Artix.
  # cosmalia-postinstall generates /etc/machine-id instead.
  - removeuser
  - users
  - locale
  - keyboard
  - localecfg
  - fstab
  - networkcfg
  - shellprocess@cosmalia
  - shellprocess@limine
  - umount
- show:
  - finished

branding: cosmalia

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false

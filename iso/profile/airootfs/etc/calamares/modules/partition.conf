# Simple, deterministic layout for the offline image copy:
#   GPT -> 300 MiB EFI system partition (/boot/efi) + ext4 root (/).
# ext4 avoids btrfs subvolume handling in Limine; the kernel command line
# only needs root=UUID=<uuid>.
---
efi:
    mountPoint:        "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        64MiB
    label:              "EFI"

userSwapChoices:
    - none

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

# Select "erase disk" by default: it is the supported (and tested) path.
initialPartitioningChoice: erase
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false

# Do not try to unmount the live image's squashfs/overlay mounts.
essentialMounts: [ "live-*", "control", "ventoy", "artix", "run/artix" ]

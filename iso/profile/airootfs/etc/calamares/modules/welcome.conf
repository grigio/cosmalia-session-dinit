# Requirements for the offline Cosmalia install. No internet is needed
# (the squashfs is already on the media), so do not gate the installer on a
# network check. Storage/RAM checks still protect against tiny disks.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 5.0
    requiredRam: 1.0
    check:
        - storage
        - ram
        - cpu
    required:
        - ram

geoip:
    style: none

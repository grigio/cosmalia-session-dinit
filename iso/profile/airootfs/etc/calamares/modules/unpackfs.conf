# Copy the running live environment to the target disk. The vendored Artix
# mkarchiso lays the boot media out under /run/artix/bootmnt/<install_dir>/,
# i.e. "cosmalia" for this ISO (see ../profiledef.sh). No network, no pacstrap.
---
unpack:
    -   source: "/run/artix/bootmnt/cosmalia/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
    -   source: "/run/artix/bootmnt/cosmalia/boot/x86_64/vmlinuz-linux"
        sourcefs: "file"
        destination: "/boot/vmlinuz-linux"

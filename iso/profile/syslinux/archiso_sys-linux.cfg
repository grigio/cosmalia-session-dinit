LABEL cosmalia
TEXT HELP
Boot the Cosmalia live desktop on BIOS (generic hardware).
ENDTEXT
MENU LABEL Cosmalia Live (Artix dinit, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr loglevel=5 console=tty0 console=ttyS0,115200

LABEL cosmaliaintel
TEXT HELP
Boot with Intel Panther Lake / Xe workarounds.
ENDTEXT
MENU LABEL Cosmalia Live (Intel Panther Lake, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=2G copytoram=auto module_blacklist=pcspkr loglevel=5 console=tty0 console=ttyS0,115200 nowatchdog i8042.dumbkbd xe.enable_psr=0 xe.enable_panel_replay=0 xe.enable_fbc=0 xe.enable_dc=0 iwlwifi.power_save=0 iwlwifi.enable_ini=0


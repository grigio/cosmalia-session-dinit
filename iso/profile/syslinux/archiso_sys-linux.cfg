LABEL cosmalia
TEXT HELP
Boot the Cosmalia live desktop (Artix Linux / dinit).
ENDTEXT
MENU LABEL Cosmalia Live (Artix dinit, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND artixbasedir=%INSTALL_DIR% artixlabel=%ARCHISO_LABEL% cow_spacesize=512M copytoram=n module_blacklist=pcspkr nowatchdog loglevel=5 console=tty0

LABEL cosmaliassafe
TEXT HELP
Copy squashfs to RAM before mounting (needs ~1.5 GB RAM).
ENDTEXT
MENU LABEL Cosmalia Live (safe, copy squashfs to RAM, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND artixbasedir=%INSTALL_DIR% artixlabel=%ARCHISO_LABEL% cow_spacesize=512M copytoram=y module_blacklist=pcspkr nowatchdog loglevel=7 console=tty0

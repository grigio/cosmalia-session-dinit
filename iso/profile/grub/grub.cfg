# Cosmalia Live (Artix Linux / dinit) — GRUB config for UEFI boot.

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default=cosmalia
set timeout=10
set timeout_style=menu

menuentry "Cosmalia Live (Artix dinit)" --class arch --class gnu-linux --class os --id 'cosmalia' {
    echo "Starting Cosmalia Live, please wait..."
    sleep 2
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% \
        cow_spacesize=2G copytoram=auto module_blacklist=pcspkr \
        loglevel=5 console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Cosmalia Live (Intel Panther Lake quirks)" --class arch --class gnu-linux --class os --id 'cosmalia-intel' {
    echo "Starting Cosmalia Live (Intel quirks), please wait..."
    sleep 2
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% \
        cow_spacesize=2G copytoram=auto module_blacklist=pcspkr \
        loglevel=5 console=tty0 console=ttyS0,115200 \
        nowatchdog i8042.dumbkbd xe.enable_psr=0 xe.enable_panel_replay=0 \
        xe.enable_fbc=0 xe.enable_dc=0 iwlwifi.power_save=0 iwlwifi.enable_ini=0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Cosmalia Live (nomodeset fallback)" --class arch --class gnu-linux --class os --id 'cosmalia-nomodeset' {
    echo "Starting Cosmalia Live (nomodeset), please wait..."
    sleep 2
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux \
        archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% \
        cow_spacesize=2G copytoram=auto module_blacklist=pcspkr nomodeset \
        loglevel=5 console=tty0 console=ttyS0,115200
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" = 'efi' ]; then
    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}

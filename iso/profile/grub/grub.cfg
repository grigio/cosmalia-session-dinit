# Cosmalia Live (Artix Linux / dinit) — GRUB config for UEFI boot.
# Two entries: normal and a safe copy-to-RAM fallback. Both boot dinit and
# cosmalia-session-dinit. No serial console: on some bare-metal machines a
# registered ttyS0 console hangs the boot right after "squashfs: version 4.0".

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    set gfxpayload=text
    terminal_input console
    terminal_output gfxterm
fi

set default=cosmalia
set timeout=10
set timeout_style=menu

menuentry "Cosmalia Live (Artix dinit)" --class arch --class gnu-linux --class os --id 'cosmalia' {
    echo "Starting Cosmalia Live, please wait..."
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux \
        artixbasedir=%INSTALL_DIR% artixlabel=%ARCHISO_LABEL% \
        cow_spacesize=512M copytoram=n module_blacklist=pcspkr nowatchdog \
        loglevel=5 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

# Same desktop, but the squashfs is copied to RAM before mounting. Use this if
# the normal entry stalls while reading the USB stick. Needs ~1.5 GB of RAM.
menuentry "Cosmalia Live (safe, copy squashfs to RAM)" --class arch --class gnu-linux --class os --id 'cosmalia-safe' {
    echo "Starting Cosmalia Live (safe mode), please wait..."
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux \
        artixbasedir=%INSTALL_DIR% artixlabel=%ARCHISO_LABEL% \
        cow_spacesize=512M copytoram=y module_blacklist=pcspkr nowatchdog \
        loglevel=7 console=tty0
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

name: Artix package

# Builds the cosmalia-session-dinit Artix package and attaches it to a
# GitHub release, for every release tag (v*).
#
# Triggers
#   push of a v* tag   build and publish that tag
#   workflow_dispatch  rebuild an existing tag (e.g. after fixing the packaging)
#
# The package itself is version-less: pkgver comes from the tag (v1.2.3 ->
# 1.2.3) and pkgrel from the number of commits that touched the packaging, so
# a rebuild of the same tag is still seen by pacman as an upgrade.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: artix-package-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: artixlinux/artixlinux:base-devel
      options: --privileged
    steps:
      # git has to exist before checkout, otherwise actions/checkout falls back
      # to downloading a tarball and there is no history for the pkgrel count.
      - name: Bootstrap git, gh, and shellcheck
        run: pacman -Syu --noconfirm --needed --disable-download-timeout git github-cli shellcheck

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build package
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          version=${TAG#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag $TAG is not v<major>.<minor>.<patch>" >&2
            exit 1
          }

          # pkgrel monotonic with packaged changes: 1, 2, 3, ...
          pkgrel=$(git rev-list --count HEAD -- \
            PKGBUILD cosmalia-session-dinit.install files README.md LICENSE \
            scripts/set-default-greetd.sh)
          (( pkgrel >= 1 )) || pkgrel=1
          echo "building cosmalia-session-dinit $version-$pkgrel"

          useradd -m builder 2>/dev/null || true
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          mkdir -p /tmp/pkgout
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/pkgout

          # --nodeps: cosmic-comp is in the official repositories but other
          # deps (noctalia, cosmic-settings, etc.) are not; skip the check.
          su builder -s /bin/bash -c "
            cd '$GITHUB_WORKSPACE'
            SESSION_VERSION='$version' SESSION_PKGREL='$pkgrel' \
            PKGDEST=/tmp/pkgout \
            makepkg --nodeps --noconfirm --force
          "

      - name: Collect packages
        id: pkg
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          shopt -s nullglob
          assets=()
          for file in *.pkg.tar.zst; do
            sha256sum "$file" > "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          (( ${#assets[@]} )) || { echo "no package was produced" >&2; exit 1; }
          printf '%s\n' "${assets[@]}" > /tmp/assets.txt
          cat /tmp/assets.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          cd /tmp/pkgout
          mapfile -t assets < /tmp/assets.txt

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists, uploading assets"
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            notes=$(cat <<EOF
          Artix Linux package of [Cosmalia](https://github.com/$GITHUB_REPOSITORY)
          \`$TAG\`: the opinionated XDG session (launcher, session entry and
          dinit user services) for cosmic-comp + Noctalia.

          ### Install

          \`\`\`sh
          gh release download $TAG -R $GITHUB_REPOSITORY -p '*.pkg.tar.zst*' -D /tmp/cosmalia-session-dinit
          cd /tmp/cosmalia-session-dinit && sha256sum -c ./*.pkg.tar.zst.sha256
          sudo pacman -U ./*.pkg.tar.zst
          \`\`\`

          The package does not change the greeter default. To make it selectable
          in a gtkgreet dropdown without changing the default:

          \`\`\`sh
          sudo cosmalia-session-default --list
          \`\`\`

          Then, optionally, make it the greeter default:

          \`\`\`sh
          sudo cosmalia-session-default
          \`\`\`

          Needs \`cosmic-comp\`, \`noctalia\`, \`cosmic-settings\`,
          \`cosmic-settings-daemon\`, \`cosmic-screenshot\`,
          \`xdg-desktop-portal-cosmic\`, \`polkit\`,
          \`gnome-keyring\` and \`wireplumber\`. Replaces the old
          \`cosmalia-session\` package.

          ### Revert

          \`\`\`sh
          sudo pacman -R cosmalia-session-dinit
          \`\`\`
          EOF
            )
            gh release create "$TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$notes" \
              --verify-tag
          fi
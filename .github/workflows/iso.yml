name: Live ISO (Artix dinit)

# Builds the Artix/dinit Cosmalia live ISO on every v* tag and attaches it to
# the release. workflow_dispatch rebuilds/attaches to an existing tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.4.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: iso-dinit-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  iso:
    name: ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: artixlinux/artixlinux:base-devel
      options: --privileged
    steps:
      - name: Bootstrap build tools
        run: |
          # Only Artix repositories; the base container mirrorlist may be dead.
          cat >/etc/pacman.d/mirrorlist <<'EOF'
          Server = https://mirror.clarkson.edu/artix-linux/repos/$repo/os/$arch
          Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch
          Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch
          EOF
          sed -i 's|^SigLevel.*|SigLevel = Optional TrustAll|' /etc/pacman.conf
          pacman -Syu --noconfirm --needed --disable-download-timeout \
            git github-cli sudo curl mkinitcpio squashfs-tools grub syslinux \
            dosfstools mtools libisoburn shellcheck

      - name: Checkout (with tags for pkgver/pkgrel)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # workflow_dispatch must build the requested tag, not master.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Prepare unprivileged builder (makepkg refuses root)
        run: |
          useradd -m builder 2>/dev/null || true
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 0440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build ISO
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # build.sh lives with the ISO project and reads the session sources
          # from SESSION_SRC_DIR (the checkout, not /home/g/...). Packages and
          # mkarchiso scratch must stay outside the checkout; the ISO itself
          # could go to iso/out/, but CI keeps all artifacts under /tmp.
          su builder -s /bin/bash -c "cd '$GITHUB_WORKSPACE/iso' && \
            SESSION_SRC_DIR='$GITHUB_WORKSPACE' \
            ISO_REPO_DIR='/tmp/cosmalia-iso-repo' \
            ISO_OUT_DIR='/tmp/cosmalia-iso-out' \
            ISO_WORK_DIR='/tmp/cosmalia-iso-work' ./build.sh"

      - name: Verify ISO contents
        run: |
          set -euo pipefail
          W=/tmp/cosmalia-iso-work
          # Two GRUB entries, both booting dinit.
          [ "$(grep -c '^menuentry' "$W/grub/grub.cfg")" = 2 ]
          grep -q 'menuentry "Cosmalia Live (Artix dinit)"' "$W/grub/grub.cfg"
          grep -q 'copytoram=y' "$W/grub/grub.cfg"
          # Pure Artix image: no Arch repos or packages.
          P="$W/iso/cosmalia/pkglist.x86_64.txt"
          ! grep -qiE 'archlinux|extra/' "$P"
          grep -q '^ungoogled-chromium ' "$P"
          grep -q '^cosmalia-session-dinit ' "$P"
          grep -q '^greetd ' "$P"
          echo 'ISO verification passed: Artix-only packages, 2 GRUB entries'

      - name: Attach ISO to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # artix-package.yml also runs on tag pushes; the other job may have
          # created the release already. Tolerate that race.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG" || {
              sleep 5
              gh release view "$TAG" >/dev/null 2>&1 || {
                echo "release $TAG could not be created" >&2
                exit 1
              }
            }
          fi
          gh release upload "$TAG" /tmp/cosmalia-iso-out/*.iso --clobber

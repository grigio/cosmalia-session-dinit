[preferred]
# xdg-desktop-portal reads this file because the session sets
# XDG_CURRENT_DESKTOP=cosmalia:COSMIC and checks the names in that list in
# order: cosmalia-portals.conf wins over the cosmic-portals.conf shipped by
# xdg-desktop-portal-cosmic. Only one file is used, so the entries that file
# provides (default, Secret) are repeated here.
#
# Name every interface explicitly. A bare `default=gtk;` would send
# Settings/Access/RemoteDesktop to the GTK backend (which does not implement
# RemoteDesktop), so pinning them here is what actually keeps them working
# under cosmic-comp.
org.freedesktop.impl.portal.FileChooser=cosmic
org.freedesktop.impl.portal.Settings=cosmic
org.freedesktop.impl.portal.Access=cosmic
org.freedesktop.impl.portal.RemoteDesktop=cosmic

# Screen capture must be served by the wlroots backend: xdg-desktop-portal-cosmic
# crashes on ext_image_copy_capture_session_v1 errors, while
# xdg-desktop-portal-wlr implements the same ext_image_copy_capture protocol
# that cosmic-comp advertises. This is what makes OBS's "Screen Capture
# (PipeWire)" source appear. xdg-desktop-portal-wlr is a hard dependency.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr

# Fallback for the interfaces the session does not pin above (Print, Account,
# Email, AppChooser, ...): use the GTK backend. xdg-desktop-portal-gtk is a
# hard dependency because of this.
default=gtk;

# gnome-keyring provides the Secret portal. Its .portal file still says
# UseIn=gnome, but UseIn is deprecated; naming the backend here selects it
# without pulling in the GNOME portal backend or Mutter.
org.freedesktop.impl.portal.Secret=gnome-keyring

# The GTK backend implements Inhibit, but its inhibitor calls
# org.gnome.SessionManager, which no Cosmalia session provides: if it were
# selected, every inhibit request would fail. Noctalia handles idle and
# suspend itself, so keep the interface unimplemented rather than broken.
org.freedesktop.impl.portal.Inhibit=none
